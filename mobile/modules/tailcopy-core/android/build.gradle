plugins {
  id 'com.android.library'
  id 'expo-module-gradle-plugin'
}

group = 'io.github.moorew.tailcopy'
version = '0.1.0'

android {
  namespace "io.github.moorew.tailcopy.core"
  defaultConfig {
    versionCode 1
    versionName '0.1.0'
  }
  sourceSets {
    main {
      // Built by `npm run rust:android`: the Rust core for each ABI and its
      // uniffi Kotlin bindings (SPEC 21.2).
      jniLibs.srcDirs += ['../rust/jniLibs']
      java.srcDirs += ['../rust/kotlin']
      // Brand icons generated from design/ (scripts/design.mjs).
      res.srcDirs += ['../../../native-assets/android']
    }
  }
}

dependencies {
  implementation "androidx.core:core-ktx:1.17.0"
  implementation "androidx.work:work-runtime-ktx:2.12.0"
  implementation "net.java.dev.jna:jna:5.19.1@aar"
  implementation "org.jetbrains.kotlinx:kotlinx-coroutines-android:1.10.2"
}
