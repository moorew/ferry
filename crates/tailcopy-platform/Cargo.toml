[package]
name = "tailcopy-platform"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
image = { version = "0.25.10", default-features = false, features = ["png"] }
tailcopy-core.workspace = true
thiserror = "2.0.21"
tracing = "0.1.44"

[target.'cfg(windows)'.dependencies]
clipboard-rs = "0.3.5"
clipboard-win = "5.4.3"
enigo = "0.6.1"
windows = { version = "0.62.2", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_System_DataExchange",
    "Win32_System_Threading",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_WindowsAndMessaging",
] }

[target.'cfg(target_os = "macos")'.dependencies]
clipboard-rs = "0.3.5"
enigo = "0.6.1"
objc2-app-kit = { version = "0.3.2", default-features = false, features = ["std", "libc", "NSRunningApplication", "NSWorkspace"] }
objc2-foundation = { version = "0.3.2", default-features = false, features = ["std", "NSString", "NSURL"] }

[target.'cfg(target_os = "linux")'.dependencies]
futures-util = "0.3.31"
gtk = "0.18.2"
zbus = { version = "6.2.1", default-features = false, features = ["tokio", "proxy"] }

[lints]
workspace = true
