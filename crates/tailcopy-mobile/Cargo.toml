[package]
name = "tailcopy-mobile"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true
description = "The phone apps' core: store, search and sync behind uniffi bindings (SPEC 21.2)"

[lib]
crate-type = ["lib", "cdylib", "staticlib"]

[[bin]]
name = "uniffi-bindgen"
path = "src/bin/uniffi-bindgen.rs"
required-features = ["bindgen"]

[features]
bindgen = ["uniffi/cli"]

[dependencies]
tailcopy-core.workspace = true
tailcopy-sync.workspace = true
anyhow = "1.0.100"
if-addrs = "0.15.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
thiserror = "2.0.21"
tokio = { version = "1.54.1", features = ["rt-multi-thread", "sync", "time", "macros"] }
tracing = "0.1.44"
tracing-appender = "0.2.4"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
uniffi = "0.32.2"

[dev-dependencies]
tempfile = "3.27.0"

[lints]
workspace = true
