[package]
name = "tailcopy-sync"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
tailcopy-core.workspace = true
anyhow = "1.0.100"
async-trait = "0.1.92"
axum = { version = "0.8.9", default-features = false, features = ["http1", "tokio", "ws", "json"] }
fastrand = "2.5.0"
futures-util = { version = "0.3.31", default-features = false, features = ["sink", "std"] }
reqwest = { version = "0.13.5", default-features = false }
# Sync is plain HTTP over WireGuard, but when another crate in the same build turns on
# reqwest's rustls support, every client needs a crypto provider installed first.
rustls = { version = "0.23.46", default-features = false, features = ["ring", "std"] }
rmp-serde = "1.3.1"
serde = { version = "1.0.229", features = ["derive"] }
serde_bytes = "0.11.19"
serde_json = "1.0.154"
thiserror = "2.0.21"
tokio = { version = "1.54.1", features = ["rt", "net", "sync", "time", "macros"] }
tokio-tungstenite = { version = "0.29.0", default-features = false, features = ["handshake"] }
tracing = "0.1.44"

[dev-dependencies]
tempfile = "3.27.0"
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros"] }

[lints]
workspace = true
