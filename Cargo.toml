[workspace]
resolver = "3"
members = ["crates/*", "app/src-tauri"]
exclude = ["spikes"]

[workspace.package]
version = "0.0.0"
edition = "2024"
license = "MIT OR Apache-2.0"
repository = "https://github.com/moorew/ferry"
publish = false

[workspace.dependencies]
tailcopy-core = { path = "crates/tailcopy-core" }
tailcopy-sync = { path = "crates/tailcopy-sync" }
tailcopy-tailnet = { path = "crates/tailcopy-tailnet" }
tailcopy-platform = { path = "crates/tailcopy-platform" }
tailcopy-testkit = { path = "crates/tailcopy-testkit" }

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"

[workspace.lints.clippy]
dbg_macro = "warn"
todo = "warn"

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"
