name: TailCopy release

# Pushing a version tag (v0.1.0) builds the Windows, macOS and Ubuntu installers and
# publishes them as a GitHub Release, with notes from docs/releases/<tag>.md and a
# SHA256SUMS file. The tag must match the version in app/src-tauri/tauri.conf.json.
#
# macOS signing and notarization use these repository secrets when present, and fall
# back to an ad-hoc signature without them:
#   APPLE_CERTIFICATE           base64 of the "Developer ID Application" .p12
#   APPLE_CERTIFICATE_PASSWORD  its export password
#   APPLE_SIGNING_IDENTITY      e.g. "Developer ID Application: Will Moore (TEAMID)"
#   APPLE_ID, APPLE_PASSWORD    Apple ID and an app-specific password, for notarization
#   APPLE_TEAM_ID               the 10-character team id

on:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  check:
    name: Check the tag
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      # Nothing is built or signed unless the tag is a released commit on main
      # with a matching version and release notes.
      - name: Tag is on main, matches the version, has notes
        run: |
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main || { echo "tag $GITHUB_REF_NAME isn't on main"; exit 1; }
          V=$(node -p "require('./app/src-tauri/tauri.conf.json').version")
          [ "$GITHUB_REF_NAME" = "v$V" ] || { echo "tag $GITHUB_REF_NAME doesn't match version $V"; exit 1; }
          test -f "docs/releases/$GITHUB_REF_NAME.md"

  windows:
    name: Windows x64
    needs: check
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable branch, pinned
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json
      - run: npm ci
        working-directory: app
      - name: Installer
        working-directory: app
        run: npx tauri build
      - name: Name
        shell: bash
        run: |
          V=$(node -p "require('./app/src-tauri/tauri.conf.json').version")
          mkdir out
          cp target/release/bundle/nsis/*-setup.exe "out/TailCopy-$V-windows-x64-setup.exe"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: tailcopy-windows-x64
          path: out/

  macos:
    needs: check
    name: macOS universal
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable branch, pinned
        with:
          toolchain: stable
          targets: aarch64-apple-darwin, x86_64-apple-darwin
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json
      - run: npm ci
        working-directory: app
      - name: App and disk image
        working-directory: app
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          # Empty secrets would make Tauri try to sign with nothing; drop them instead.
          for v in APPLE_CERTIFICATE APPLE_CERTIFICATE_PASSWORD APPLE_SIGNING_IDENTITY APPLE_ID APPLE_PASSWORD APPLE_TEAM_ID; do
            [ -n "${!v}" ] || unset $v
          done
          npx tauri build --target universal-apple-darwin
      - name: Name
        run: |
          V=$(node -p "require('./app/src-tauri/tauri.conf.json').version")
          mkdir out
          cp target/universal-apple-darwin/release/bundle/dmg/*.dmg "out/TailCopy-$V-macos-universal.dmg"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: tailcopy-macos-universal
          path: out/

  linux:
    needs: check
    name: Ubuntu amd64
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libxdo-dev
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable branch, pinned
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json
      - run: npm ci
        working-directory: app
      - name: Debian package (app and GNOME extension)
        working-directory: app
        run: npx tauri build
      - name: Name and inspect
        run: |
          V=$(node -p "require('./app/src-tauri/tauri.conf.json').version")
          mkdir out
          cp target/release/bundle/deb/*.deb "out/TailCopy-$V-ubuntu-amd64.deb"
          dpkg-deb --info out/*.deb
          dpkg-deb --contents out/*.deb
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: tailcopy-ubuntu-amd64
          path: out/

  release:
    name: Release
    needs: [windows, macos, linux]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: dist
          merge-multiple: true
      - name: Check the tag and notes
        run: |
          V=$(node -p "require('./app/src-tauri/tauri.conf.json').version")
          [ "$GITHUB_REF_NAME" = "v$V" ] || { echo "tag $GITHUB_REF_NAME doesn't match version $V"; exit 1; }
          test -f "docs/releases/$GITHUB_REF_NAME.md"
      - name: Checksums
        working-directory: dist
        run: sha256sum -- * > SHA256SUMS && cat SHA256SUMS
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          V=$(node -p "require('./app/src-tauri/tauri.conf.json').version")
          gh release create "$GITHUB_REF_NAME" dist/* --verify-tag --latest \
            --title "TailCopy $V" --notes-file "docs/releases/$GITHUB_REF_NAME.md"
