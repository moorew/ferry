name: Spike builds

# Builds the Milestone 0 spikes so they can be downloaded and run on real machines.
# Separate from CI (SPEC 13 keeps spikes out of it); delete after the M0 gate.

on:
  push:
    paths: ['spikes/**', '.github/workflows/spikes.yml']
  workflow_dispatch:

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            spikes/clipboard-win
            spikes/tailnet
      - run: cargo build --release
        working-directory: spikes/clipboard-win
      - run: cargo build --release
        working-directory: spikes/tailnet
      - uses: actions/upload-artifact@v7
        with:
          name: spikes-windows
          path: |
            spikes/clipboard-win/target/release/clipboard-win-spike.exe
            spikes/tailnet/target/release/tailnet-spike.exe

  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin, x86_64-apple-darwin
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            spikes/clipboard-mac
            spikes/tailnet
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Clipboard spike app (universal, ad-hoc signed)
        working-directory: spikes/clipboard-mac
        run: npx --yes @tauri-apps/cli@2.12.4 build --bundles app --target universal-apple-darwin
      - name: Tailnet spike (universal)
        working-directory: spikes/tailnet
        run: |
          cargo build --release --target aarch64-apple-darwin
          cargo build --release --target x86_64-apple-darwin
          lipo -create -output tailnet-spike \
            target/aarch64-apple-darwin/release/tailnet-spike \
            target/x86_64-apple-darwin/release/tailnet-spike
      - name: Pack
        run: |
          mkdir out
          ditto -c -k --keepParent "spikes/clipboard-mac/target/universal-apple-darwin/release/bundle/macos/ferry-clipboard-mac-spike.app" out/ferry-clipboard-mac-spike.app.zip
          cp spikes/tailnet/tailnet-spike out/
      - uses: actions/upload-artifact@v7
        with:
          name: spikes-macos
          path: out/

  linux:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libxdo-dev
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            spikes/gnome-client
            spikes/tailnet
      - run: cargo build --release
        working-directory: spikes/gnome-client
      - run: cargo build --release
        working-directory: spikes/tailnet
      - name: Pack the extension spike
        run: |
          mkdir -p out/ferry@moorew.github.io/schemas
          cp spikes/gnome-extension/{extension.js,metadata.json} out/ferry@moorew.github.io/
          cp spikes/gnome-extension/schemas/*.xml out/ferry@moorew.github.io/schemas/
          cp spikes/gnome-client/target/release/gnome-client-spike spikes/tailnet/target/release/tailnet-spike out/
      - uses: actions/upload-artifact@v7
        with:
          name: spikes-linux
          path: out/
