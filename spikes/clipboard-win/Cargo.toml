[package]
name = "tailcopy"
version = "0.0.1"
edition = "2024"
publish = false

# Standalone M0 spike, not a workspace member.
[workspace]

[build-dependencies]
tauri-build = "2.7.4"

[dependencies]
clipboard-rs = "0.3.5"
clipboard-win = "5.4.3"
enigo = "0.6.1"
serde = { version = "1.0.229", features = ["derive"] }
tauri = "2.12.5"
tauri-plugin-global-shortcut = "2.4.1"
windows = { version = "0.62.2", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_System_DataExchange",
    "Win32_System_Threading",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_WindowsAndMessaging",
] }
