[package]
name = "tailcopy"
version = "0.0.1"
edition = "2024"
publish = false

# Standalone M0 spike, not a workspace member.
[workspace]

[build-dependencies]
tauri-build = "2.7.4"

[dependencies]
clipboard-rs = "0.3.5"
enigo = "0.6.1"
objc2-app-kit = { version = "0.3.2", default-features = false, features = ["std", "libc", "NSRunningApplication", "NSWorkspace"] }
objc2-foundation = { version = "0.3.2", default-features = false, features = ["std", "NSString"] }
serde = { version = "1.0.229", features = ["derive"] }
tauri = "2.12.5"
tauri-plugin-global-shortcut = "2.4.1"
