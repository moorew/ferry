[package]
name = "gnome-client-spike"
version = "0.0.0"
edition = "2024"
publish = false

# Standalone M0 spike, not a workspace member.
[workspace]

[build-dependencies]
tauri-build = "2.7.4"

[dependencies]
futures-util = "0.3.31"
gtk = "0.18.2"
serde = { version = "1.0.229", features = ["derive"] }
tauri = "2.12.5"
tokio = { version = "1.54.1", features = ["time", "macros"] }
zbus = { version = "6.2.1", default-features = false, features = ["tokio", "proxy"] }
