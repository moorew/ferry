[package]
name = "tailnet-spike"
version = "0.0.0"
edition = "2024"
publish = false

# Standalone M0 spike, not a workspace member.
[workspace]

[dependencies]
anyhow = "1.0.100"
axum = "0.8.9"
reqwest = { version = "0.13.5", default-features = false, features = ["json"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tokio = { version = "1.54.1", features = ["full"] }
