[package]
name = "tailcopy"
description = "Keyboard-first clipboard manager that syncs over your tailnet"
version = "0.1.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[lib]
name = "tailcopy_app"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7.4", features = [] }

[dependencies]
tailcopy-core.workspace = true
tailcopy-platform.workspace = true
ammonia = "4.2.4"
interprocess = { version = "2.4.7", features = ["tokio"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tauri = { version = "2.12.5", features = ["tray-icon", "image-png", "macos-private-api"] }
tauri-plugin-autostart = "2.7.0"
tauri-plugin-notification = "2.8.0"
tauri-plugin-opener = "2.7.2"
tokio = { version = "1.54.1", features = ["rt-multi-thread", "sync", "time", "macros", "io-util"] }
tracing = "0.1.44"
tracing-appender = "0.2.5"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }

[target.'cfg(any(windows, target_os = "macos"))'.dependencies]
tauri-plugin-global-shortcut = "2.4.1"

[target.'cfg(target_os = "linux")'.dependencies]
gtk = "0.18.2"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62.2", features = ["Win32_System_Console"] }

[lints]
workspace = true
