[package]
name = "tailcopy"
description = "Keyboard-first clipboard manager that syncs over your tailnet"
version = "0.3.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[lib]
name = "tailcopy_app"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7.4", features = [] }

[dependencies]
tailcopy-core.workspace = true
tailcopy-platform.workspace = true
tailcopy-sync.workspace = true
qrcode = { version = "0.14.1", default-features = false }
anyhow = "1.0.100"
tailcopy-tailnet.workspace = true
ammonia = "4.2.4"
directories = "6.0.0"
interprocess = { version = "2.4.7", features = ["tokio"] }
reqwest = { version = "0.13.5", default-features = false, features = ["rustls-no-provider", "json"] }
rustls = { version = "0.23.46", default-features = false, features = ["ring", "std", "tls12"] }
semver = "1.0.28"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tauri = { version = "2.12.5", features = ["tray-icon", "image-png", "macos-private-api"] }
tauri-plugin-autostart = "2.7.0"
tauri-plugin-notification = "2.8.0"
tauri-plugin-global-shortcut = "2.4.1"
tauri-plugin-opener = "2.7.2"
tokio = { version = "1.54.1", features = ["rt-multi-thread", "sync", "time", "macros", "io-util", "process"] }
tracing = "0.1.44"
tracing-appender = "0.2.5"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }

[target.'cfg(target_os = "linux")'.dependencies]
futures-util = "0.3.31"

[target.'cfg(unix)'.dependencies]
libc = "0.2.191"

[target.'cfg(windows)'.dependencies]
widestring = "1.2.1"
windows = { version = "0.62.2", features = ["Win32_Foundation", "Win32_Graphics_Dwm", "Win32_System_Console", "Win32_System_Registry"] }

[lints]
workspace = true
